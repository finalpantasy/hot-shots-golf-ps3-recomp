[toolchain]
python = ".venv/Scripts/python.exe"
cmake = ".venv/Lib/site-packages/cmake/data/bin/cmake.exe"
clang_cl = "external/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe"
ps3recomp = "external/ps3recomp"
eboot = "work/extracted/fix-1.02/USRDIR/EBOOT.elf"

[[stages]]
name = "analyze"
inputs = [
  "work/extracted/fix-1.02/USRDIR/EBOOT.elf",
  "external/ps3recomp/tools/ppu_loader.py",
  "external/ps3recomp/tools/gen_imports.py",
  "external/ps3recomp/tools/extract_spu_images.py",
  "external/ps3recomp/tools/spu_lifter.py"
]
outputs = ["analysis/fix-1.02"]
commands = [
  ["${python}", "${ps3recomp}/tools/ppu_loader.py", "${eboot}", "-o", "analysis/fix-1.02"],
  ["${python}", "${ps3recomp}/tools/gen_imports.py", "${eboot}", "-o", "analysis/fix-1.02/imports_named.json"],
  ["${python}", "${ps3recomp}/tools/extract_spu_images.py", "${eboot}", "--output", "analysis/fix-1.02/spu/images"],
  ["${python}", "${ps3recomp}/tools/spu_lifter.py", "analysis/fix-1.02/spu/images/spu_0000_at_00C9B300.elf", "--auto-functions", "analysis/fix-1.02/spu/images/spu_0000_at_00C9B300.elf", "--output", "analysis/fix-1.02/spu/lifted"]
]

[[stages]]
name = "spu"
inputs = [
  "work/extracted/fix-1.02/USRDIR/EBOOT.elf",
  "external/ps3recomp/tools/build_spu_workloads.py",
  "external/ps3recomp/tools/spu_program_pipeline.py",
  "external/ps3recomp/tools/spu_lifter.py",
  "external/ps3recomp/tools/find_spu_functions.py",
  "external/ps3recomp/tools/spu_disasm.py",
  "tools/spu_lift_jobs.py",
  "tools/spu_jobs.json"
]
outputs = ["port/spu"]
# build_spu_workloads replaces port/spu as a unit, so the raw SPURS job lift
# (tools/spu_lift_jobs.py, jobs listed in tools/spu_jobs.json) must run after it.
commands = [
  ["${python}", "${ps3recomp}/tools/build_spu_workloads.py", "--input", "${eboot}", "--lifted", "port/spu", "--out", "port/spu/spu_workloads.c", "--constructor", "--allow-partial"],
  ["${python}", "tools/spu_lift_jobs.py", "--manifest", "tools/spu_jobs.json", "--lifted", "port/spu", "--out", "port/spu/spu_jobs_register.c"]
]

[[stages]]
name = "lift"
inputs = [
  "work/extracted/fix-1.02/USRDIR/EBOOT.elf",
  "analysis/fix-1.02/EBOOT.functions.json",
  "analysis/fix-1.02/EBOOT.imports.json",
  "external/ps3recomp/tools/ppu_lifter.py",
  "external/ps3recomp/tools/gen_hle_nids.py"
]
outputs = ["generated/fix-1.02/recompiled"]
commands = [
  ["${python}", "${ps3recomp}/tools/ppu_lifter.py", "${eboot}", "--functions", "analysis/fix-1.02/EBOOT.functions.json", "--hle-stubs", "analysis/fix-1.02/EBOOT.imports.json", "--code-end", "0xd17018", "--chunks", "64", "--output", "generated/fix-1.02/recompiled"],
  ["${python}", "${ps3recomp}/tools/gen_hle_nids.py", "--all", "--out", "generated/fix-1.02/recompiled/ppu_hle_nids.cpp"]
]

[[stages]]
name = "build"
inputs = [
  "generated/fix-1.02/recompiled",
  "port",
  "external/ps3recomp"
]
outputs = ["build/fix-1.02/HotShotsGolfRecomp.exe"]
commands = [
  ["${cmake}", "-S", "port", "-B", "build/fix-1.02", "-G", "Ninja", "-DPS3RECOMP_DIR=${root}/${ps3recomp}", "-DRECOMP_DIR=${root}/generated/fix-1.02/recompiled", "-DPython3_EXECUTABLE=${root}/${python}", "-DPORT_SPU_INPUTS:STRING=", "-DSPU_DIR=${root}/port/spu", "-DCMAKE_CXX_FLAGS:STRING=", "-DCMAKE_EXE_LINKER_FLAGS:STRING=", "-DCMAKE_C_COMPILER=${root}/${clang_cl}", "-DCMAKE_C_COMPILER_ARG1=--driver-mode=cl", "-DCMAKE_CXX_COMPILER=${root}/${clang_cl}", "-DCMAKE_CXX_COMPILER_ARG1=--driver-mode=cl", "-DCMAKE_BUILD_TYPE=Release"],
  ["${cmake}", "--build", "build/fix-1.02", "--config", "Release"]
]
