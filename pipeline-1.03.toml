[toolchain]
python = ".venv/Scripts/python.exe"
cmake = ".venv/Lib/site-packages/cmake/data/bin/cmake.exe"
clang_cl = "external/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe"
ps3recomp = "external/ps3recomp"
eboot = "work/extracted/update-1.03/USRDIR/EBOOT.elf"

[[stages]]
name = "analyze"
inputs = [
  "work/extracted/update-1.03/USRDIR/EBOOT.elf",
  "external/ps3recomp/tools/ppu_loader.py",
  "external/ps3recomp/tools/gen_imports.py",
  "external/ps3recomp/tools/extract_spu_images.py",
  "external/ps3recomp/tools/spu_lifter.py"
]
outputs = ["analysis/official-1.03"]
commands = [
  ["${python}", "${ps3recomp}/tools/ppu_loader.py", "${eboot}", "-o", "analysis/official-1.03"],
  ["${python}", "${ps3recomp}/tools/gen_imports.py", "${eboot}", "-o", "analysis/official-1.03/imports_named.json"],
  ["${python}", "${ps3recomp}/tools/extract_spu_images.py", "${eboot}", "--output", "analysis/official-1.03/spu/images"],
  ["${python}", "${ps3recomp}/tools/spu_lifter.py", "analysis/official-1.03/spu/images/spu_0000_at_00C9CE80.elf", "--auto-functions", "analysis/official-1.03/spu/images/spu_0000_at_00C9CE80.elf", "--output", "analysis/official-1.03/spu/lifted"]
]

[[stages]]
name = "spu"
inputs = [
  "work/extracted/update-1.03/USRDIR/EBOOT.elf",
  "external/ps3recomp/tools/build_spu_workloads.py",
  "external/ps3recomp/tools/spu_program_pipeline.py",
  "external/ps3recomp/tools/spu_lifter.py",
  "external/ps3recomp/tools/find_spu_functions.py",
  "external/ps3recomp/tools/spu_disasm.py",
  "tools/spu_lift_jobs.py",
  "tools/spu_jobs-1.03.json"
]
outputs = ["port/spu-1.03"]
commands = [
  ["${python}", "${ps3recomp}/tools/build_spu_workloads.py", "--input", "${eboot}", "--lifted", "port/spu-1.03", "--out", "port/spu-1.03/spu_workloads.c", "--constructor", "--allow-partial"],
  ["${python}", "tools/spu_lift_jobs.py", "--manifest", "tools/spu_jobs-1.03.json", "--input", "${eboot}", "--lifted", "port/spu-1.03", "--out", "port/spu-1.03/spu_jobs_register.c"]
]

[[stages]]
name = "lift"
inputs = [
  "work/extracted/update-1.03/USRDIR/EBOOT.elf",
  "analysis/official-1.03/EBOOT.functions.json",
  "analysis/official-1.03/EBOOT.imports.json",
  "external/ps3recomp/tools/ppu_lifter.py",
  "external/ps3recomp/tools/gen_hle_nids.py"
]
outputs = ["generated/official-1.03/recompiled"]
commands = [
  ["${python}", "${ps3recomp}/tools/ppu_lifter.py", "${eboot}", "--functions", "analysis/official-1.03/EBOOT.functions.json", "--hle-stubs", "analysis/official-1.03/EBOOT.imports.json", "--code-end", "0xd18b98", "--chunks", "64", "--output", "generated/official-1.03/recompiled"],
  ["${python}", "${ps3recomp}/tools/gen_hle_nids.py", "--all", "--out", "generated/official-1.03/recompiled/ppu_hle_nids.cpp"]
]

[[stages]]
name = "build"
inputs = [
  "generated/official-1.03/recompiled",
  "port",
  "external/ps3recomp"
]
outputs = ["build/official-1.03/HotShotsGolfRecomp.exe"]
commands = [
  ["${cmake}", "-S", "port", "-B", "build/official-1.03", "-G", "Ninja", "-DPS3RECOMP_DIR=${root}/${ps3recomp}", "-DRECOMP_DIR=${root}/generated/official-1.03/recompiled", "-DHSG_TARGET_PROFILE=official-1.03", "-DPython3_EXECUTABLE=${root}/${python}", "-DPORT_SPU_INPUTS:STRING=", "-DSPU_DIR=${root}/port/spu-1.03", "-DCMAKE_CXX_FLAGS:STRING=", "-DCMAKE_EXE_LINKER_FLAGS:STRING=", "-DCMAKE_C_COMPILER=${root}/${clang_cl}", "-DCMAKE_C_COMPILER_ARG1=--driver-mode=cl", "-DCMAKE_CXX_COMPILER=${root}/${clang_cl}", "-DCMAKE_CXX_COMPILER_ARG1=--driver-mode=cl", "-DCMAKE_BUILD_TYPE=Release"],
  ["${cmake}", "--build", "build/official-1.03", "--config", "Release"]
]
